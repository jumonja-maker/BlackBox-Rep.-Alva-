name: BB-INV-003 isolated acceptance (no publication)

on:
  push:
    branches: [patch/bb-inv-003]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bb-inv-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Investigation graph contracts (${{ matrix.os }})
    if: github.ref == 'refs/heads/patch/bb-inv-003'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11.14'
            lock: requirements/ci-linux-py311.lock
          - os: windows-latest
            python: '3.11.9'
            lock: requirements/ci-windows-py311.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      BB_QA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install pinned QA dependencies
        run: |
          python -m pip install --require-hashes -r ${{ matrix.lock }}
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Undefined bindings and syntax gate
        run: python tools/check_undefined_names.py --report inv-contracts-static.json
      - name: Evidence identity time graph hypotheses grouping storage and GUI contracts
        run: python -m unittest discover -s tests -p 'test_inv*.py' -v
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: BB-INV-003-CONTRACTS-${{ matrix.os }}
          path: inv-contracts-static.json
          retention-days: 30
          if-no-files-found: warn
