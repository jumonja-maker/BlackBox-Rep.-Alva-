name: Retired Investigation source importer (manual status only)

# Investigation 0.1.2 is already integrated. The old push hook could overwrite
# public main from an unrelated patch branch. It is intentionally retired.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired-status:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Importer retired; source changes require a separately reviewed pull request."
