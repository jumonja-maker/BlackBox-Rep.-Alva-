name: BLACK.BOX - authentic Investigation 3 README screenshot

on:
  push:
    branches: [docs/investigation-v3-visual-guide-20261031]
    paths:
      - .github/workflows/investigation-v3-readme-image.yml

permissions:
  contents: write

jobs:
  extract-verified-screenshot:
    name: Verify and commit real Windows CI screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Extract exact screenshot from signed-off BB-INV-003 technical report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          from pathlib import Path
          import struct
          import subprocess
          import zipfile

          repo = "jumonja-maker/BlackBox-Rep.-Alva-"
          document_blob = "62c50ce4bf6b14c5e3d70d28efe41e800adcd45a"
          source_sha256 = "d7b13b00771c1cb3ee73abde0b9b6fa1832e26269e928f660bc5bf3ca1128e90"
          png_sha256 = "4c76511cb9fbde009a6909382a57af51ec5fb8061abbd2c70dd01045bfca6b1f"
          api_result = subprocess.run(
              ["gh", "api", f"repos/{repo}/git/blobs/{document_blob}"],
              check=True, capture_output=True, text=True, timeout=60
          )
          blob = json.loads(api_result.stdout)
          if blob.get("encoding") != "base64" or blob.get("sha") != document_blob:
              raise SystemExit("REPORT_SOURCE_BLOB_MISMATCH")
          data = base64.b64decode(blob["content"], validate=False)
          if hashlib.sha256(data).hexdigest() != source_sha256:
              raise SystemExit("REPORT_SOURCE_SHA256_MISMATCH")
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              shot = z.read("word/media/rId62.png")
          if hashlib.sha256(shot).hexdigest() != png_sha256:
              raise SystemExit("SCREENSHOT_SHA256_MISMATCH")
          if shot[:8] != bytes.fromhex("89504e470d0a1a0a") or (
                  struct.unpack(">II", shot[16:24]) != (1024, 720)):
              raise SystemExit("SCREENSHOT_FORMAT_OR_SIZE_MISMATCH")
          dest = Path("docs/screenshots/ru-investigation-v3-critical-path.png")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(shot)
          print("VERIFIED_REAL_CI_SCREENSHOT", dest, len(shot), png_sha256)
          PY
      - name: Commit screenshot to documentation branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "docs/investigation-v3-visual-guide-20261031"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/screenshots/ru-investigation-v3-critical-path.png
          if git diff --cached --quiet; then
            echo "Verified screenshot already committed"
          else
            git commit -m "docs: add authentic Investigation Engine 3 CI screenshot"
            git push origin HEAD:docs/investigation-v3-visual-guide-20261031
          fi
