name: Native noise policy pilot - observations only, no publication

on:
  push:
    branches: [diagnostic/native-noise-boost-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-noise-policy-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  noise-policy-pilot:
    name: Real Windows owned noise policy ABBA observations
    runs-on: windows-latest
    timeout-minutes: 38
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install exact locked source dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-windows-py311.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: New boost policy contracts (not native acceptance)
        run: python -m unittest discover -s tests -p test_decoder_noise_boost_control.py -v
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Build exact-source self-contained decoder
        run: python tools/build_decoder.py --rid win-x64
      - name: Prepare fresh same-job native fixture with external output hash
        id: prepare
        timeout-minutes: 2
        run: python tools/qa_decoder_noise_fixture.py --prepare-fixture --output noise-policy-pilot/native-build --source-sha '${{ github.sha }}'
      - name: Two real same-job pairs, inherited and disabled owned-worker boosts
        timeout-minutes: 32
        run: python tools/qa_decoder_noise_policy_pilot.py --output noise-policy-pilot --helper decoder/BLACK.BOX-Decoder.exe --source-sha '${{ github.sha }}' --prepared-build-sha256 '${{ steps.prepare.outputs.manifest_sha256 }}'
