name: PR25 read-only review source snapshot
on:
  push:
    branches: [review/pr25-readonly-source-20261028]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7dfe33f448391093f7fa6424b354d6fffe6e7d64
          persist-credentials: false
      - name: Archive exact reviewed source without changing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=zip -o "$RUNNER_TEMP/review-source/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/review-source/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/review-source/source-tree.txt"
          sha256sum "$RUNNER_TEMP/review-source/source.zip" > "$RUNNER_TEMP/review-source/source.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PR25-EXACT-REVIEW-SOURCE
          path: ${{ runner.temp }}/review-source/
          retention-days: 7
          if-no-files-found: error
