name: Stage authentic README screenshots (manual, no source writes)

on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: "Successful same-repository QA run containing BLACKBOX-OFFSCREEN-DPI-QA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stage-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate explicit source run
        id: source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.qa_run_id }}
        run: |
          import json, os, re, subprocess
          value = os.environ['REQUESTED_RUN']
          if not re.fullmatch('[1-9][0-9]{0,19}', value):
              raise ValueError('INVALID_QA_RUN')
          repo = os.environ['GITHUB_REPOSITORY']
          raw = subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{value}'], text=True)
          run = json.loads(raw)
          if (run.get('status') != 'completed' or run.get('conclusion') != 'success'
                  or run.get('head_repository', {}).get('full_name') != repo
                  or not re.fullmatch('[0-9a-f]{40}', run.get('head_sha', ''))):
              raise ValueError('SOURCE_QA_NOT_VERIFIED')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run_id='+value+'\n')
          with open('screenshot-source.json', 'x') as out:
              json.dump({'run_id':int(value), 'source_sha':run['head_sha'],
                         'artifact':'BLACKBOX-OFFSCREEN-DPI-QA'}, out)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: BLACKBOX-OFFSCREEN-DPI-QA
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blackbox-readme-qa
      - name: Validate and stage images only
        shell: python
        run: |
          from pathlib import Path
          import os, shutil, struct
          original = Path(os.environ['RUNNER_TEMP'])/'blackbox-readme-qa'
          output = Path('reviewed-screenshots'); output.mkdir()
          sources = {'overview':'dashboard', 'processes':'processes',
                     'settings':'settings', 'reports':'reports',
                     'decoder':'decoder', 'investigation':'research'}
          for lang in ('EN','RU'):
              for title, source in sources.items():
                  name = (f'expanded-1.25-{lang}-research-16.png' if title == 'investigation'
                          else f'dpi-1.25-{lang}-{source}.png')
                  src = original/name
                  if src.is_symlink() or not src.is_file():
                      raise ValueError('MISSING_OR_LINKED_SCREENSHOT:'+name)
                  with src.open('rb') as handle:
                      header = handle.read(24)
                  if header[:8] != bytes.fromhex('89504e470d0a1a0a') or header[12:16] != b'IHDR':
                      raise ValueError('INVALID_PNG:'+name)
                  width,height = struct.unpack('>II',header[16:24])
                  if not 640 <= width <= 4096 or not 400 <= height <= 4096:
                      raise ValueError('INVALID_GEOMETRY:'+name)
                  shutil.copyfile(src, output/f'{lang.lower()}-{title}.png')
          shutil.copyfile('screenshot-source.json', output/'screenshot-source.json')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: README-SCREENSHOTS-FOR-REVIEW
          path: reviewed-screenshots/
          retention-days: 14
          if-no-files-found: error
