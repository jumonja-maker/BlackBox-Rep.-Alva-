name: Prepare deterministic UI source object
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.repository == 'jumonja-maker/BlackBox-Rep.-Alva-' &&
      github.event.pull_request.number == 17 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/bb-di-001-action-integration-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03df9cc874a310f46a4724b3b813e03898dc532a
          persist-credentials: false
      - name: Create style-only Git blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast, difflib, hashlib, json, pathlib, subprocess
          path = pathlib.Path('blackbox_universal/window.py')
          original = path.read_bytes()
          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert git_blob(original) == '0aefab89ab4e4255a6f307ab7a2d232b2d6c64cc'
          text = original.decode('utf-8')
          replacements = (
              ('    widget.setStyleSheet("background: transparent;")',
               '    widget.setObjectName("pageBody")\n    widget.setStyleSheet("QWidget#pageBody { background: transparent; }")'),
              ('        body.setStyleSheet("background: #fff7e4;")',
               '        body.setObjectName("shellBody")\n        body.setStyleSheet("QWidget#shellBody { background: #fff7e4; }")'),
              ('        self.stack.setStyleSheet("background: #fff7e4;")',
               '        self.stack.setObjectName("pageStack")\n        self.stack.setStyleSheet("QStackedWidget#pageStack { background: #fff7e4; }")'),
          )
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          ast.parse(text)
          before = ast.parse(original.decode('utf-8'))
          after = ast.parse(text)
          # Outside _page/_build, every function AST remains identical.
          functions = lambda tree: {n.name: ast.dump(n) for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name not in ('_page', '_build')}
          assert functions(before) == functions(after)
          out = pathlib.Path('prepared-ui'); out.mkdir()
          (out / 'window.py').write_text(text, encoding='utf-8', newline='\n')
          diff = ''.join(difflib.unified_diff(original.decode('utf-8').splitlines(True), text.splitlines(True), fromfile='a/blackbox_universal/window.py', tofile='b/blackbox_universal/window.py'))
          (out / 'scope-only.patch').write_text(diff, encoding='utf-8')
          payload = json.dumps({'content': text, 'encoding': 'utf-8'})
          response = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/jumonja-maker/BlackBox-Rep.-Alva-/git/blobs', '--input', '-'], input=payload, text=True, capture_output=True, check=True)
          result = json.loads(response.stdout)
          assert result['sha'] == git_blob(text.encode('utf-8'))
          (out / 'blob.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(diff)
          print('PREPARED_STYLE_ONLY_BLOB=' + result['sha'])
          print('NO_BRANCH_TAG_RELEASE_OR_INSTALLATION_MODIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-PREPARED-UI-SOURCE-${{ github.run_id }}
          path: prepared-ui/
          if-no-files-found: error
          retention-days: 7
