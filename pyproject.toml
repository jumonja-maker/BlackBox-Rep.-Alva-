[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-core"
version = "0.5.2"
description = "Local-first, read-only process observation and evidence reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "BLACK.BOX contributors"}]
dependencies = []

[project.optional-dependencies]
process = ["psutil>=6,<8"]

[project.scripts]
blackbox = "blackbox_core.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["blackbox_core*", "blackbox_investigation*", "blackbox_universal*"]
namespaces = false
